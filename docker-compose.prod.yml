version: '3.8'

# Esta red externa es la que conectará a Gemflix con tu proxy global (Traefik) en el servidor Ubuntu.
# Se debe crear en tu Ubuntu con: `docker network create traefik_web_network`
networks:
  traefik_web_network:
    external: true
  gemflix_internal:
    driver: bridge

services:
  # Base de Datos
  postgres:
    image: postgres:18-alpine
    container_name: gemflix-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-gemflix}
    volumes:
      - gemflix_pgdata:/var/lib/postgresql
      - /etc/localtime:/etc/localtime:ro
    networks:
      - gemflix_internal
    # Limitar el uso de CPU/RAM para PostgreSQL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Redis (Para Refresh Tokens / Cache)
  redis:
    image: redis:8-alpine
    container_name: gemflix-redis
    restart: always
    networks:
      - gemflix_internal
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # Backend Go
  backend:
    image: ghcr.io/gemflix/gemflix-backend:latest
    container_name: gemflix-backend
    restart: always
    environment:
      - DB_SOURCE=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-root}@postgres:5432/${POSTGRES_DB:-gemflix}?sslmode=disable
      - REDIS_URL=redis:6379
      - PORT=8080
      # Añadir variables de entorno secretas desde un archivo .env
    env_file:
      - .env
    networks:
      - gemflix_internal
      - traefik_web_network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    labels:
      - "traefik.enable=true"
      # Rutas HTTPS para el backend (API)
      - "traefik.http.routers.gemflix-api.rule=Host(`api.gemflix.org`)"
      - "traefik.http.routers.gemflix-api.entrypoints=websecure"
      - "traefik.http.routers.gemflix-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.gemflix-api.loadbalancer.server.port=8080"
      
      # Redirección de HTTP a HTTPS para el backend
      - "traefik.http.middlewares.redirect-https-backend.redirectscheme.scheme=https"
      - "traefik.http.routers.gemflix-api-http.rule=Host(`api.gemflix.org`)"
      - "traefik.http.routers.gemflix-api-http.entrypoints=web"
      - "traefik.http.routers.gemflix-api-http.middlewares=redirect-https-backend"

  # Frontend Next.js
  frontend:
    image: ghcr.io/gemflix/gemflix-frontend:latest
    container_name: gemflix-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.gemflix.org
    networks:
      - traefik_web_network
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    labels:
      - "traefik.enable=true"
      # Middleware global de redirección HTTPS
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      
      # 1. Router para Admin (Exactamente igual que Portainer)
      - "traefik.http.routers.gemflix-admin.rule=Host(`admin.gemflix.org`)"
      - "traefik.http.routers.gemflix-admin.entrypoints=websecure"
      - "traefik.http.routers.gemflix-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gemflix-admin-http.rule=Host(`admin.gemflix.org`)"
      - "traefik.http.routers.gemflix-admin-http.entrypoints=web"
      - "traefik.http.routers.gemflix-admin-http.middlewares=redirect-to-https"

      # 2. Router para Play (Exactamente igual que Portainer)
      - "traefik.http.routers.gemflix-play.rule=Host(`play.gemflix.org`)"
      - "traefik.http.routers.gemflix-play.entrypoints=websecure"
      - "traefik.http.routers.gemflix-play.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gemflix-play-http.rule=Host(`play.gemflix.org`)"
      - "traefik.http.routers.gemflix-play-http.entrypoints=web"
      - "traefik.http.routers.gemflix-play-http.middlewares=redirect-to-https"

      # 3. Router para Main (gemflix.org)
      - "traefik.http.routers.gemflix-main.rule=Host(`gemflix.org`)"
      - "traefik.http.routers.gemflix-main.entrypoints=websecure"
      - "traefik.http.routers.gemflix-main.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gemflix-main-http.rule=Host(`gemflix.org`)"
      - "traefik.http.routers.gemflix-main-http.entrypoints=web"
      - "traefik.http.routers.gemflix-main-http.middlewares=redirect-to-https"

      # 4. Router para WWW (www.gemflix.org)
      - "traefik.http.routers.gemflix-www.rule=Host(`www.gemflix.org`)"
      - "traefik.http.routers.gemflix-www.entrypoints=websecure"
      - "traefik.http.routers.gemflix-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.gemflix-www-http.rule=Host(`www.gemflix.org`)"
      - "traefik.http.routers.gemflix-www-http.entrypoints=web"
      - "traefik.http.routers.gemflix-www-http.middlewares=redirect-to-https"
      
      # Conectar todos los routers al puerto 3000 de Next.js
      - "traefik.http.services.gemflix-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.gemflix-admin.service=gemflix-web"
      - "traefik.http.routers.gemflix-play.service=gemflix-web"
      - "traefik.http.routers.gemflix-main.service=gemflix-web"
      - "traefik.http.routers.gemflix-www.service=gemflix-web"
      - "traefik.http.routers.gemflix-admin-http.service=gemflix-web"
      - "traefik.http.routers.gemflix-play-http.service=gemflix-web"
      - "traefik.http.routers.gemflix-main-http.service=gemflix-web"
      - "traefik.http.routers.gemflix-www-http.service=gemflix-web"

volumes:
  gemflix_pgdata:
